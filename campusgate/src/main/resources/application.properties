spring.application.name=campusgate
server.port=${PORT:8080}

# Dev profile is used unless another one is set (SPRING_PROFILES_ACTIVE)
spring.profiles.default=dev

# Database & JPA config (defaults are for local development only)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_gate_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Security Config
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=CAMPUS-GATE-TEAM
app.security.jwt.expiration-seconds=1800

# Temporary account lock after repeated failed logins
app.security.login.max-failed-attempts=5
app.security.login.lock-minutes=15

# CORS: origins allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://mdev-repos.github.io}

# Public demo mode (off by default; enabled by the demo profile)
app.demo.enabled=false
app.demo.password=${DEMO_PASSWORD:}

# Admin Seed Config
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Pagination: default and maximum page size
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Logging (base level; profiles override it)
logging.level.root=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
