# Public demo deployment: the schema is created on the first run and fictional data is loaded and reset periodically.
# It wipes every user except the real admin, so never point it at a database with real data.
spring.jpa.hibernate.ddl-auto=update
app.demo.enabled=true
app.demo.reset-cron=0 0 4 * * *
logging.level.com.mdev.campusgate=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
